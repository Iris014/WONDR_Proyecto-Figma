<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WONDR - Unidades Recomendadas</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">WONDR</div>
            <div class="nav-item active"><span class="nav-icon"></span>Inicio</div>
            <div class="nav-item"><span class="nav-icon"></span>Misiones</div>
            <div class="nav-item"><span class="nav-icon"></span>Clases</div>
            <div class="nav-item"><span class="nav-icon"></span>Progreso</div>
            <div class="circle-btn bg-white mt-auto" style="width:36px; height:36px; color:#18181b;"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="horizontal-scroll w-100 mb-4" style="gap:2rem;">
                <div class="vertical-card bg-purple-light flex-center">Unidad 1</div>
                <div class="vertical-card bg-green-light flex-center">Unidad 2</div>
                <div class="vertical-card bg-yellow-light flex-center">Unidad 3</div>
                <div class="vertical-card bg-blue-light flex-center">Unidad 4</div>
                <div class="vertical-card bg-pink-light flex-center">Unidad 5</div>
                <div class="vertical-card bg-green-light flex-center">Unidad 6</div>
                <div class="vertical-card bg-purple-light flex-center">Unidad 7</div>
                <div class="vertical-card bg-orange-light flex-center" style="min-width: 60px;">></div>
            </div>
            
            <h2 class="mb-2">Recomendados</h2>
            <div class="horizontal-scroll w-100">
                <div class="vertical-card large bg-pink text-white rounded-xl shadow-sm">
                    <span class="font-bold text-lg">Cómo acceder al<br>audio</span>
                    <span class="text-title" style="font-size:2rem;">🎧</span>
                </div>
                <div class="vertical-card large bg-pink text-white rounded-xl shadow-sm">
                    <span class="font-bold text-lg">Cómo verificar un<br>mapa</span>
                    <span class="text-title" style="font-size:2rem;">🧩</span>
                </div>
                <div class="vertical-card large bg-purple text-white rounded-xl shadow-sm justify-end flex-col align-end">
                    <span class="text-title bg-white rounded-full flex-center" style="width:40px;height:40px;">⏸</span>
                </div>
                <div class="vertical-card large bg-indigo text-white rounded-xl shadow-sm">
                    <span class="font-bold text-lg">Qué muestra el árbol</span>
                    <span class="text-title" style="font-size:2rem;">🌳</span>
                </div>
                <div class="vertical-card bg-green text-white rounded-xl shadow-sm flex-center" style="min-width: 40px; height:140px;">
                    <span class="font-bold">></span>
                </div>
            </div>

            <div class="fab-container">
                <div class="pill-btn">N clases</div>
                <div class="circle-btn">?</div>
            </div>
        </main>
    </div>
</body>
</html>
